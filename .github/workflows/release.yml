name: Release

# P2-32：此前发版纯靠人工（本地打包 + 手动建 Release / 传资产），没有可复现流程。
# 本 workflow 只做「打 tag → 三平台打包 → 汇总上传成 **draft** release」的骨架：
#   - 产物默认是 draft，人工核对说明文案与资产后再点发布，不会自动覆盖线上 Release；
#   - 所有 action 与 ci.yml 一样 pin 到 commit SHA；
#   - FFmpeg / libvlc 在 CI 有网络时由 fetch-ffmpeg* 与 vlcSetup 联网获取；
#     离线环境需预置归档或设置 KTDOWNLOAD_FFMPEG_ZIP；
#   - macOS 产物默认仍是 ad-hoc 签名（runner 上没有 Developer ID 证书）。真实签名 +
#     公证需要 Apple 凭证，请在受信任的 macOS 上执行 scripts/notarize-macos.sh，
#     本 workflow 刻意不接 Apple secrets，避免把凭证放进 CI；
#   - Linux 产物可能不含内置 FFmpeg（README 已说明该平台需自行准备），需实机验证。
# 首次启用前请先用 workflow_dispatch 跑一次并核对 draft 内容，再用于正式 tag。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的 tag（如 v1.0.4）；留空则取当前 ref'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Fetch bundled FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Fetch bundled FFmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/fetch-ffmpeg-macos.sh

      - name: Package release distribution
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --no-configuration-cache --no-daemon --console=plain

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find composeApp/build/compose/binaries/main-release -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.pkg' \
               -o -name '*.deb' -o -name '*.rpm' \) -exec cp -n {} dist/ \;
          ls -lh dist

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: create draft release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
