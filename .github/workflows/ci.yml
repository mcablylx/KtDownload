name: CI

# P2-26：三平台矩阵 + 固定 action commit SHA + 移除遗留的 check_01 常驻触发分支。
#   - Linux / macOS / Windows 都跑同一套纯 JVM 单测，都是硬门禁（不加 continue-on-error，
#     避免重演 P1-01「用 continue-on-error 掩盖失败」）。POSIX 精确权限断言在 Windows 按
#     assumption 跳过，属预期差异；三个平台首次远端实测若暴露平台特有问题，按日志单独修。
#   - 冒烟 / 集成用例不在此任务内：P2-29 已拆到 opt-in 的 :composeApp:integrationTest，
#     所以这里的绿灯只代表「纯 JVM 单测」，不再把零覆盖的 CDP/JCEF/VLC/ffmpeg 计入。
#   - 4 个 action 全部 pin 到 commit SHA（防上游 tag 被移动），注释保留对应版本便于升级。
#   - --no-daemon：一次性 CI 构建不需要常驻守护进程；shell: bash 让 windows-latest
#     也走 Git Bash，三平台共用同一条命令。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-test:
    name: jvmTest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # 本项目 configuration cache 有序列化问题，所有命令都必须带 --no-configuration-cache
      - name: Run JVM unit tests
        shell: bash
        run: ./gradlew :composeApp:jvmTest --no-configuration-cache --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jvmtest-report-${{ matrix.os }}
          path: |
            composeApp/build/reports/tests/jvmTest
            composeApp/build/test-results/jvmTest
          if-no-files-found: ignore
          retention-days: 14

      # 把每个测试类的用例数/失败数写进 job summary：绿/红之外还要能一眼看到
      # 失败在哪、有没有被静默 skip。纯只读汇总，解析异常不影响上面的测试结论。
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" - <<'PY' || echo "test summary unavailable"
          import glob, os, xml.etree.ElementTree as ET
          files = sorted(glob.glob("composeApp/build/test-results/jvmTest/TEST-*.xml"))
          out = os.environ.get("GITHUB_STEP_SUMMARY")
          total = failed = errors = skipped = 0
          bad = []
          for f in files:
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              t = int(r.get("tests", 0)); fa = int(r.get("failures", 0))
              er = int(r.get("errors", 0)); sk = int(r.get("skipped", 0))
              total += t; failed += fa; errors += er; skipped += sk
              if fa or er:
                  bad.append((r.get("name", f), fa + er))
          lines = ["## jvmTest 结果", "",
                   f"- 测试类：{len(files)}，用例：{total}，失败：{failed}，错误：{errors}，跳过：{skipped}", ""]
          if bad:
              lines += ["### 失败用例", ""] + [f"- `{n}` ({c})" for n, c in bad]
          else:
              lines += ["全部通过 ✅"]
          text = "\n".join(lines) + "\n"
          print(text)
          if out:
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY
