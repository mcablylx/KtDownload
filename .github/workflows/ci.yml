name: CI

# P3-T1：此前 900 个单测只在本地手动跑，团队层面拿不到回归信号。
# 这里在 push / PR 上跑一次 JVM 单测，失败时把报告作为 artifact 捞回来。

on:
  push:
    branches: [ main, master, check_01 ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-test:
    # 单测是纯 JVM（Compose Desktop 不需要显示器），Linux 上最快也最便宜。
    # 构建脚本按构建机平台选择 jcefmaven / vlcj 的 natives，Linux amd64 有对应产物。
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 本项目 configuration cache 有序列化问题，所有命令都必须带 --no-configuration-cache
      - name: Run JVM unit tests
        run: ./gradlew :composeApp:jvmTest --no-configuration-cache --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvmtest-report
          path: |
            composeApp/build/reports/tests/jvmTest
            composeApp/build/test-results/jvmTest
          if-no-files-found: ignore
          retention-days: 14

      # 把每个测试类的用例数/失败数写进 job summary：绿/红之外还要能一眼看到
      # 失败在哪、有没有被静默 skip。纯只读汇总，解析异常不影响上面的测试结论。
      - name: Publish test summary
        if: always()
        run: |
          python3 - <<'PY' || echo "test summary unavailable"
          import glob, os, xml.etree.ElementTree as ET
          files = sorted(glob.glob("composeApp/build/test-results/jvmTest/TEST-*.xml"))
          out = os.environ.get("GITHUB_STEP_SUMMARY")
          total = failed = errors = skipped = 0
          bad = []
          for f in files:
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              t = int(r.get("tests", 0)); fa = int(r.get("failures", 0))
              er = int(r.get("errors", 0)); sk = int(r.get("skipped", 0))
              total += t; failed += fa; errors += er; skipped += sk
              if fa or er:
                  bad.append((r.get("name", f), fa + er))
          lines = ["## jvmTest 结果", "",
                   f"- 测试类：{len(files)}，用例：{total}，失败：{failed}，错误：{errors}，跳过：{skipped}", ""]
          if bad:
              lines += ["### 失败用例", ""] + [f"- `{n}` ({c})" for n, c in bad]
          else:
              lines += ["全部通过 ✅"]
          text = "\n".join(lines) + "\n"
          print(text)
          if out:
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY
